[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "shifting-work-hours"
version = "1.0.0"
description = "Climate change impact on labor productivity in China"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "chenyuyou"}
]

dependencies = [
    "xarray>=2023.1.0",
    "numpy>=1.24.0",
    "cupy-cuda12x>=12.0.0",
    "tqdm>=4.65.0",
    "pandas>=2.0.0",
    "geopandas>=0.13.0",
    "regionmask>=0.9.0",
    "requests>=2.28.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "black>=23.3.0",
    "ruff>=0.0.260",
]
scrapy = [
    "Scrapy>=2.9.0",
    "itemadapter>=0.7.0",
]

[project.scripts]
shifting-wh = "scripts.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
